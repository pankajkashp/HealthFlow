# HealthFlow CI
#
# Jobs:
#   python-quality   — Ruff lint + MyPy type check across the Python monorepo
#   python-tests     — pytest across the Python monorepo (needs Postgres)
#   frontend-quality — TypeScript type check + ESLint on apps/web
#   frontend-tests   — Vitest on apps/web
#   frontend-build   — Next.js production build on apps/web
#
# Since Phase 6, apps/api depends on packages/domain, packages/application,
# packages/infrastructure, and services/agent depends on packages/domain and
# packages/application — all referenced by bare package name (not path or version),
# so every Python job installs the full dependency chain in order, from the repo root,
# the same way docker/api.Dockerfile and local development do. Earlier phases didn't need
# this because apps/api had no cross-package dependencies until Phase 6.
#
# NOT configured:
#   - AWS deployment
#   - Live Bedrock / Anthropic calls (python-tests runs with LLM_PROVIDER=scripted)
#   - Security scanning (beyond npm audit)

name: HealthFlow CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:

  # ---------------------------------------------------------------------------
  # Python: Linting and type checking
  # ---------------------------------------------------------------------------
  python-quality:
    name: Python Quality (Ruff + MyPy)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install the monorepo (dependency order)
        run: |
          pip install -e packages/domain
          pip install -e packages/shared
          pip install -e packages/safety
          pip install -e packages/application
          pip install -e packages/infrastructure
          pip install -e services/agent
          pip install -e "apps/api[dev]"
          pip install ruff mypy

      - name: Ruff — lint check
        run: ruff check packages/ services/ apps/ tests/ scripts/ migrations/

      - name: Ruff — format check
        run: ruff format --check packages/ services/ apps/ tests/ scripts/ migrations/

      - name: MyPy — static type check
        run: |
          mypy packages/domain packages/shared packages/safety packages/application \
               packages/infrastructure services/agent apps/api tests/

  # ---------------------------------------------------------------------------
  # Python: Tests
  # ---------------------------------------------------------------------------
  python-tests:
    name: Python Tests (pytest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: healthflow_dev
          POSTGRES_USER: healthflow
          POSTGRES_PASSWORD: healthflow_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U healthflow -d healthflow_dev"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://healthflow:healthflow_ci@localhost:5432/healthflow_dev
      LLM_PROVIDER: scripted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install the monorepo (dependency order)
        run: |
          pip install -e packages/domain
          pip install -e packages/shared
          pip install -e packages/safety
          pip install -e packages/application
          pip install -e packages/infrastructure
          pip install -e services/agent
          pip install -e "apps/api[dev]"

      - name: Run migrations
        run: alembic upgrade head

      - name: Seed synthetic benchmark data
        run: python scripts/seed_demo_data.py

      - name: pytest
        run: python -m pytest tests/ apps/api/tests/ -v

  # ---------------------------------------------------------------------------
  # Frontend: TypeScript type check + ESLint
  # ---------------------------------------------------------------------------
  frontend-quality:
    name: Frontend Quality (TypeScript + ESLint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript — type check
        run: npx tsc --noEmit

      - name: ESLint — lint check
        run: npm run lint

  # ---------------------------------------------------------------------------
  # Frontend: Vitest tests
  # ---------------------------------------------------------------------------
  frontend-tests:
    name: Frontend Tests (Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Vitest — run tests
        run: npm run test

  # ---------------------------------------------------------------------------
  # Frontend: Production build
  # ---------------------------------------------------------------------------
  frontend-build:
    name: Frontend Build (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Next.js build
        run: npm run build
