# HealthFlow CI
#
# Phase 1 engineering foundation CI pipeline.
#
# Jobs:
#   python-quality   — Ruff lint + MyPy type check on apps/api
#   python-tests     — pytest on apps/api
#   frontend-quality — TypeScript type check + ESLint on apps/web
#   frontend-tests   — Vitest on apps/web
#   frontend-build   — Next.js production build on apps/web
#
# NOT configured in Phase 1:
#   - AWS deployment
#   - Bedrock / Strands integration
#   - Database migration checks (no schema in Phase 1)
#   - Security scanning (beyond npm audit)
#
# Ref: Phase 1 specification §11 (CI Foundation)

name: HealthFlow CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:

  # ---------------------------------------------------------------------------
  # Python: Linting and type checking
  # ---------------------------------------------------------------------------
  python-quality:
    name: Python Quality (Ruff + MyPy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install dependencies (including dev)
        run: pip install -e ".[dev]"

      - name: Ruff — lint check
        run: python -m ruff check src/ tests/

      - name: Ruff — format check
        run: python -m ruff format --check src/ tests/

      - name: MyPy — static type check
        run: python -m mypy src/

  # ---------------------------------------------------------------------------
  # Python: Tests
  # ---------------------------------------------------------------------------
  python-tests:
    name: Python Tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install dependencies (including dev)
        run: pip install -e ".[dev]"

      - name: pytest
        run: python -m pytest tests/ -v

  # ---------------------------------------------------------------------------
  # Frontend: TypeScript type check + ESLint
  # ---------------------------------------------------------------------------
  frontend-quality:
    name: Frontend Quality (TypeScript + ESLint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript — type check
        run: npx tsc --noEmit

      - name: ESLint — lint check
        run: npm run lint

  # ---------------------------------------------------------------------------
  # Frontend: Vitest tests
  # ---------------------------------------------------------------------------
  frontend-tests:
    name: Frontend Tests (Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Vitest — run tests
        run: npm run test

  # ---------------------------------------------------------------------------
  # Frontend: Production build
  # ---------------------------------------------------------------------------
  frontend-build:
    name: Frontend Build (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Next.js build
        run: npm run build
