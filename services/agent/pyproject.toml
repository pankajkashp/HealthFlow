[build-system]
requires = ["setuptools>=70.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "healthflow-agent"
version = "0.1.0"
description = "HealthFlow agent service — AWS Strands Agents SDK runtime and Claude LLM integration."
requires-python = ">=3.13"
dependencies = [
    "strands-agents>=1.50.0,<2.0.0",
    "strands-agents[anthropic]>=1.50.0,<2.0.0",
    "boto3>=1.34.0,<2.0.0",
    "pydantic>=2.7.0,<3.0.0",
    "healthflow-domain",
    "healthflow-application",
]

[tool.setuptools.packages.find]
where = ["src"]
