# HealthFlow — Docker Compose for local development
#
# This file supports Phase 1 local development ONLY.
#
# Services defined here:
#   api  — FastAPI application (apps/api/)
#   web  — Next.js application (apps/web/)
#   db   — PostgreSQL placeholder (no schema, no data — future phases)
#
# NOT configured in Phase 1:
#   - Amazon Bedrock / Claude / Strands (agent phase is later)
#   - Production AWS services
#   - Real healthcare systems or data
#   - Database schema or initialization scripts
#
# Usage:
#   docker compose -f docker/docker-compose.yml up
#
# Ref: docs/architecture/ARCHITECTURE.md §2
# Ref: Phase 1 specification §6 (Docker foundation)

services:

  api:
    build:
      context: ../apps/api
      dockerfile: ../docker/api.Dockerfile
    ports:
      - "8000:8000"
    volumes:
      # Hot reload: mount source so changes reflect without rebuild
      - ../apps/api/src:/app/src:ro
    environment:
      APP_ENV: development
      LOG_LEVEL: INFO
      API_HOST: "0.0.0.0"
      API_PORT: "8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ../apps/web
      dockerfile: ../docker/web.Dockerfile
    ports:
      - "3000:3000"
    volumes:
      # Hot reload: mount source
      - ../apps/web/src:/app/src:ro
      - ../apps/web/public:/app/public:ro
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: "http://localhost:8000"

  # ---------------------------------------------------------------------------
  # PostgreSQL placeholder — Phase 1
  #
  # This service is a placeholder for future phases.
  # The database schema is NOT defined in Phase 1.
  # No initialization scripts are attached.
  # No application code connects to this service in Phase 1.
  #
  # Schema implementation is deferred to the database schema specification phase.
  # Ref: docs/architecture/ARCHITECTURE.md §14, AD-005 (PostgreSQL)
  # Ref: Phase 1 specification §7 (Database restriction)
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: healthflow_dev
      POSTGRES_USER: healthflow
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-changeme_local_only}"
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthflow -d healthflow_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_dev_data:
    driver: local
