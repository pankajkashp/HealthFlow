# HealthFlow — Docker Compose for local development and demo
#
# Brings up the full stack: web (Next.js dashboard), api (FastAPI + the agent runtime), and db
# (PostgreSQL, migrated and seeded with the 6 synthetic benchmark patients automatically).
#
# Usage:
#   docker compose -f docker/docker-compose.yml up
#
# LLM provider (see docs/phases/PHASE_06_WALKTHROUGH.md, decision 1): LLM_PROVIDER defaults to
# "scripted" (deterministic, no LLM credentials needed, always works). Set LLM_PROVIDER=anthropic
# and ANTHROPIC_API_KEY in your shell (or a .env file next to this compose file) for the agent to
# reason with a real Claude model. LLM_PROVIDER=bedrock uses AWS_REGION/BEDROCK_MODEL_ID instead,
# matching the originally locked §17 tech stack, once Bedrock model access is available.
#
# Ref: docs/architecture/ARCHITECTURE.md §2
# Ref: docs/phases/PHASE_06_WALKTHROUGH.md

services:

  api:
    build:
      # Repo root: apps/api now depends on packages/* and services/agent (Phase 6, decision 3),
      # so the build needs to reach the whole monorepo, not just apps/api.
      context: ..
      dockerfile: docker/api.Dockerfile
    ports:
      - "8000:8000"
    volumes:
      # Hot reload: mount source so changes reflect without rebuild
      - ../apps/api/src:/app/apps/api/src:ro
      - ../packages:/app/packages:ro
      - ../services:/app/services:ro
    environment:
      APP_ENV: development
      LOG_LEVEL: INFO
      API_HOST: "0.0.0.0"
      API_PORT: "8000"
      DATABASE_URL: "postgresql+psycopg://healthflow:${POSTGRES_PASSWORD:-changeme_local_only}@db:5432/healthflow_dev"
      WEB_ORIGIN: "http://localhost:3000"
      LLM_PROVIDER: "${LLM_PROVIDER:-scripted}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      ANTHROPIC_MODEL_ID: "${ANTHROPIC_MODEL_ID:-claude-sonnet-4-5-20250929}"
      AWS_REGION: "${AWS_REGION:-us-east-1}"
      BEDROCK_MODEL_ID: "${BEDROCK_MODEL_ID:-anthropic.claude-3-5-sonnet-20241022-v2:0}"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ../apps/web
      dockerfile: ../docker/web.Dockerfile
    ports:
      - "3000:3000"
    volumes:
      # Hot reload: mount source
      - ../apps/web/src:/app/src:ro
      - ../apps/web/public:/app/public:ro
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: "http://localhost:8000"
    depends_on:
      - api

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: healthflow_dev
      POSTGRES_USER: healthflow
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-changeme_local_only}"
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthflow -d healthflow_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_dev_data:
    driver: local
