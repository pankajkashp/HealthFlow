[build-system]
requires = ["setuptools>=70.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "healthflow-application"
version = "0.1.0"
description = "HealthFlow application layer — use cases, workflow orchestration, and agent tool definitions."
requires-python = ">=3.13"
dependencies = [
    "healthflow-domain",
    "healthflow-shared",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "ruff>=0.5.0,<1.0.0",
    "mypy>=1.11.0,<2.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
