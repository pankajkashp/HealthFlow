[build-system]
requires = ["setuptools>=70.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "healthflow-infrastructure"
version = "0.1.0"
description = "HealthFlow infrastructure layer — port implementations, database adapters, and simulated system adapters."
requires-python = ">=3.13"
dependencies = [
    "healthflow-domain",
    "sqlalchemy>=2.0.30,<3.0.0",
    "alembic>=1.13.0,<2.0.0",
    "psycopg[binary]>=3.2.0,<4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "ruff>=0.5.0,<1.0.0",
    "mypy>=1.11.0,<2.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
