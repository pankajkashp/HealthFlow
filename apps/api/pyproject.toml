[build-system]
requires = ["setuptools>=70.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "healthflow-api"
version = "0.1.0"
description = "HealthFlow FastAPI application — HTTP boundary between the frontend and the application layer."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "pydantic>=2.7.0,<3.0.0",
    "healthflow-application",
    "healthflow-agent",
    # Phase 6, decision 3 (docs/phases/PHASE_06_WALKTHROUGH.md): the composition root in
    # dependencies.py is the one place in apps/api allowed to import domain/infrastructure
    # directly, to wire concrete adapters into the application-layer services.
    "healthflow-domain",
    "healthflow-infrastructure",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "httpx>=0.27.0,<1.0.0",
    "ruff>=0.5.0,<1.0.0",
    "mypy>=1.11.0,<2.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-v"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["healthflow_api"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = false
